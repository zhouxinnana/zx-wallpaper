name: Release Tauri

on:
  push:
    tags:
      - "tauri-v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "tauri-v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' must match package.json version 'tauri-v$version'."
          }
          git fetch origin tauri_master
          git merge-base --is-ancestor $env:GITHUB_SHA origin/tauri_master
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri release tags must reference a commit reachable from tauri_master."
          }

      # tauri-action 负责构建、签名、上传 .exe / .nsis.zip / .sig，并生成 updater 清单 latest.json。
      # latest.json 只对「已发布且非 prerelease」的 release 生效——客户端固定读
      # releases/latest/download/latest.json，若发成 draft 或 prerelease 会导致 404。
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 私钥只存在于仓库 Secrets，不落仓库。无密码私钥时 PASSWORD 用空字符串。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          generateReleaseNotes: true

      - name: Verify updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $names = gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.assets[].name'
          $required = @("latest.json")
          foreach ($needle in $required) {
            if ($names -notcontains $needle) {
              throw "Release is missing $needle. Assets: $($names -join ', ')"
            }
          }
          $signatures = @($names | Where-Object { $_ -like "*.sig" })
          if ($signatures.Count -lt 1) {
            throw "Release has no .sig asset; updater signature was not generated."
          }
