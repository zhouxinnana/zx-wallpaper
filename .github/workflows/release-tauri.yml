name: Release Tauri

on:
  push:
    tags:
      - "tauri-v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "tauri-v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' must match package.json version 'tauri-v$version'."
          }
          git fetch origin tauri_master
          git merge-base --is-ancestor $env:GITHUB_SHA origin/tauri_master
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri release tags must reference a commit reachable from tauri_master."
          }

      - name: Build installer
        run: npm run tauri:build

      - name: Confirm installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe"
          if ($installer.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installer.Count)."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
