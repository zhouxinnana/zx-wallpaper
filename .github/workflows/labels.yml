name: Sync Issue Labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/labels.yml]

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              {
                name: "needs-triage",
                color: "FBCA04",
                description: "Maintainer needs to evaluate this issue.",
              },
              {
                name: "needs-info",
                color: "D93F0B",
                description: "Waiting on reporter for more information.",
              },
              {
                name: "ready-for-agent",
                color: "0E8A16",
                description: "Fully specified and ready for an AFK agent.",
              },
              {
                name: "ready-for-human",
                color: "1D76DB",
                description: "Requires human implementation.",
              },
              {
                name: "wontfix",
                color: "FFFFFF",
                description: "Will not be actioned.",
              },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  ...label,
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                await github.rest.issues.updateLabel({
                  ...context.repo,
                  ...label,
                });
              }
            }
