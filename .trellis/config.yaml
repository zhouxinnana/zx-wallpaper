# Trellis 配置
# Trellis 工作流系统的项目级设置
#
# 所有配置项都有合理的默认值。只覆盖你需要的项。

#-------------------------------------------------------------------------------
# 会话记录
#-------------------------------------------------------------------------------

# 运行 add_session.py 后自动提交 journal/index 变更时使用的提交信息
session_commit_message: "chore: record journal"

# 每个日志文件超过该行数后轮转到新文件
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# 会话自动提交
#-------------------------------------------------------------------------------

# 会话日志 + 任务归档操作的自动提交行为。
# - true（默认）：脚本在 add_session.py / task.py archive 运行后自动
#   stage 并 commit journal / 任务变更。
# - false：脚本不碰 git。文件（journal-*.md、任务归档移动）仍会写入磁盘；
#   由你决定何时 git add / commit。
#
# 如果项目的 .gitignore 刻意排除 `.trellis/`、想让会话数据只留在本地，
# 或者你想在每次提交前人工审查暂存内容，用 `false`。
#
# 接受：true / false / yes / no / 1 / 0 / on / off（大小写不敏感）。
#
# session_auto_commit: true

#-------------------------------------------------------------------------------
# 任务生命周期钩子
#-------------------------------------------------------------------------------

# 任务生命周期事件后执行的 shell 命令。
# 每个钩子会收到指向 task.json 的环境变量 TASK_JSON_PATH。
# 钩子失败只打印警告，不阻断主操作。
#
# hooks:
#   after_create:
#     - "echo 'Task created'"
#   after_start:
#     - "echo 'Task started'"
#   after_finish:
#     - "echo 'Task finished'"
#   after_archive:
#     - "echo 'Task archived'"

#-------------------------------------------------------------------------------
# Monorepo / 包
#-------------------------------------------------------------------------------

# 为 monorepo 项目声明包。
# `trellis init` 会自动检测 workspaces，也可以在这里手动配置。
#
# packages:
#   frontend:
#     path: packages/frontend
#   backend:
#     path: packages/backend
#   docs:
#     path: docs-site
#     type: submodule
#   # polyrepo / meta-repo 布局（各子目录有独立 .git）时，
#   # 用 `git: true` 标记。运行时将其视为独立仓库（如 git-context 展示）。
#   webapp:
#     path: ./webapp
#     git: true

# 未指定 --package 时使用的默认包。
# default_package: frontend

#-------------------------------------------------------------------------------
# Channel worker OOM 守护
#-------------------------------------------------------------------------------
# `trellis channel spawn` worker 的默认保护措施。守护在 spawn 时运行
# （清理过期空闲 worker，然后执行存活 worker 预算检查），并在每个
# supervisor 内部运行（worker 持续空闲超过 idle_timeout 后自行终止）。
#
# 优先级：CLI 标志 > 环境变量（TRELLIS_CHANNEL_WORKER_IDLE_TIMEOUT /
# TRELLIS_CHANNEL_MAX_LIVE_WORKERS）> 本配置 > 内置默认值。
#
# idle_timeout: 0 禁用空闲清理（worker 可以永久空闲，除非 kill 或 --timeout）。
# max_live_workers: 0 禁用 spawn 时的预算检查。
#
# trusted_context_dirs 把 `--file`/`--jsonl`/`--agent` 的容器检查范围扩展到
# worker cwd 之外 —— 当 `.trellis/tasks` 或 `.trellis/workspace` 是指向外部
# 目录的符号链接时有用。任何所列目录下的 realpath 都会被接受。
# auto_trust_trellis_symlinks: false 禁用对 `.trellis/tasks` / `.trellis/workspace`
# 本身是顶层符号链接时的窄域自动信任（默认开启）。
#
channel:
  worker_guard:
    idle_timeout: 5m
    max_live_workers: 6
  # trusted_context_dirs:
  #   - /work/user/trellis_workspace
  # auto_trust_trellis_symlinks: false

#-------------------------------------------------------------------------------
# Codex（派发行为）
#-------------------------------------------------------------------------------
# 仅 Codex 生效的开关；其他平台忽略。默认（"auto"）派发
# trellis-implement / trellis-check / trellis-research 子代理。这不依赖父会话
# 转录继承：`fork_turns` 仍由调用方控制，同时 Codex 原生 SubagentStart hook
# 会在受信时注入任务上下文，不可用时子侧加载兜底。设为 "inline" 仅在
# 主会话内完成实现和检查。"sub-agent" 是向后兼容别名。无效显式值安全地
# 回落内联模式。
#
# "auto" 模式下，派发的子代理继承主会话模型，除非你固定一个。想给
# implement/check/research 子代理用更便宜/更快的模型，直接编辑生成的
# `.codex/agents/trellis-*.toml` 中的 `model` / `model_reasoning_effort`
# （见这些文件里的注释提示行）—— config.yaml 没有对应开关，
# `trellis update` 会保留你的编辑、不在再生成时覆盖。
#
# codex:
#   dispatch_mode: auto  # 或 "inline"；旧别名："sub-agent"

#-------------------------------------------------------------------------------
# 子代理上下文注入限额
#-------------------------------------------------------------------------------
# 限制首次注入子代理提示词的任务上下文量（implement.jsonl / check.jsonl
# 引用的文件，加 prd.md / design.md / implement.md）。超限文件截断并提示；
# 总量达到上限后，剩余文件降级为索引行（路径 + 原因 + 大小）而非内联。
#
# 均为字节数。0 表示禁用对应限额。
#
# context_injection:
#   max_file_bytes: 32768        # implement.jsonl / check.jsonl 引用的每个文件
#   max_artifact_bytes: 65536    # 每个任务产物（prd.md / design.md / implement.md）
#   max_total_bytes: 131072      # 整个注入载荷；溢出降级为索引行

#-------------------------------------------------------------------------------
# 逐轮提示注入
#-------------------------------------------------------------------------------
# 逐轮 <workflow-state> 面包屑的逃生舱。当用户提示包含作为独立单词的
# 跳过关键词（大小写不敏感、词边界匹配 —— "no-trellisfoo" 不算），仅该轮
# 跳过面包屑。不影响 SessionStart 和子代理上下文注入。
#
# prompt_injection:
#   skip_keyword: "no-trellis"   # "" 表示完全禁用逃生舱
