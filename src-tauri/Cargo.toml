[package]
name = "zx-wallpaper"
version = "0.1.3"
description = "Windows local-first wallpaper manager"
authors = ["ZX Wallpaper"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "zx_wallpaper_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zx-wallpaper"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
runtime = [
  "dep:image",
  "dep:notify",
  "dep:rand",
  "dep:reqwest",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:time",
  "dep:tokio",
  "dep:url",
  "dep:uuid",
  "dep:walkdir"
]
desktop = [
  "runtime",
  "dep:tauri",
  "dep:tauri-plugin-autostart",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-global-shortcut",
  "dep:tauri-plugin-opener"
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"], optional = true }
notify = { version = "8.2.0", default-features = false, optional = true }
rand = { version = "0.9", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-autostart = { version = "2.5.1", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2.3.2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
thiserror = { version = "2", optional = true }
time = { version = "0.3", features = ["formatting"], optional = true }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
url = { version = "2", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
walkdir = { version = "2", optional = true }
